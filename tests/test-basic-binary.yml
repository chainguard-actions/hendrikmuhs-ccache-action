name: Test basic ccache binary install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: binary
          restore: "false"
          save: "false"
      - name: Assert ccache installed and configured
        run: |
          set -e
          echo "ccache path: $(command -v ccache || true)"
          if ! command -v ccache >/dev/null 2>&1; then
            echo "FAIL: ccache not on PATH"
            exit 1
          fi
          ccache --version | head -n1
          CACHE_DIR="$(ccache -k cache_dir)"
          echo "cache_dir: $CACHE_DIR"
          if [ "$CACHE_DIR" != "$GITHUB_WORKSPACE/.ccache" ]; then
            echo "FAIL: expected cache_dir $GITHUB_WORKSPACE/.ccache"
            exit 1
          fi
          COMPRESSION="$(ccache -k compression)"
          echo "compression: $COMPRESSION"
          if [ "$COMPRESSION" != "true" ]; then
            echo "FAIL: expected compression=true"
            exit 1
          fi
          MAX="$(ccache -k max_size)"
          echo "max_size: $MAX"
          if ! echo "$MAX" | grep -q '500'; then
            echo "FAIL: expected default max_size of 500MB"
            exit 1
          fi
          echo "PASS"
