name: Test basic ccache usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          key: test-basic-key
          max-size: "100MB"
          verbose: 1
          append-timestamp: false
          update-package-index: true
      - name: Assert ccache is available
        run: |
          which ccache || (echo "FAIL: ccache not found in PATH" && exit 1)
          echo "PASS: ccache is available"
      - name: Assert ccache version
        run: |
          ccache --version
          echo "PASS: ccache version printed"
