name: Test basic ccache usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          max-size: 100MB
          append-timestamp: false
          update-package-index: true
      - name: Assert ccache is installed and functional
        run: |
          echo "Checking ccache is available..."
          if ! command -v ccache >/dev/null 2>&1; then
            echo "FAIL: ccache not found in PATH"
            exit 1
          fi
          echo "ccache version: $(ccache --version | head -1)"
          echo "PASS: ccache is installed"
      - name: Assert ccache max-size is configured
        run: |
          echo "Checking ccache max-size..."
          MAX_SIZE=$(ccache --get-config max_size 2>/dev/null || ccache -p 2>/dev/null | grep max_size | awk '{print $NF}')
          echo "max_size: $MAX_SIZE"
          echo "PASS: ccache is configured"
