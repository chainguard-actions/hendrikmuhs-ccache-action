name: Test compiling with ccache produces cache hit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: binary
          restore: "false"
          save: "false"
          key: compile-test
      - name: Compile twice and assert hit
        run: |
          set -e
          CC=""
          for c in gcc cc clang; do
            if command -v "$c" >/dev/null 2>&1; then CC="$c"; break; fi
          done
          if [ -z "$CC" ]; then
            echo "FAIL: no C compiler available"
            exit 1
          fi
          echo "compiler: $CC"
          TMP="$(mktemp -d)"
          printf 'int main(void){return 0;}\n' > "$TMP/hello.c"
          ccache "$CC" -c "$TMP/hello.c" -o "$TMP/a.o"
          rm -f "$TMP/a.o"
          ccache "$CC" -c "$TMP/hello.c" -o "$TMP/a.o"
          STATS="$(ccache --print-stats)"
          echo "$STATS"
          HITS=$(echo "$STATS" | awk -F'\t' '$1=="direct_cache_hit"||$1=="preprocessed_cache_hit"{s+=$2} END{print s+0}')
          echo "hits: $HITS"
          if [ "$HITS" -lt 1 ]; then
            echo "FAIL: expected at least one cache hit"
            exit 1
          fi
          if [ ! -d "$GITHUB_WORKSPACE/.ccache" ]; then
            echo "FAIL: cache dir not created"
            exit 1
          fi
          echo "PASS"
