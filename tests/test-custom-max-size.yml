name: Test ccache with custom max-size
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js 24
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x -o /tmp/nodesource_setup.sh
          sudo bash /tmp/nodesource_setup.sh
          sudo apt-get install -y nodejs
          node --version
          sudo ln -sf "$(which node)" /usr/local/bin/node24 || true

      - name: Run ccache action with custom max-size
        id: ccache
        uses: .
        with:
          variant: ccache
          max-size: 100MB
          append-timestamp: false
          restore: false
          save: false
          update-package-index: true

      - name: Assert ccache is installed
        run: |
          echo "Checking ccache is installed..."
          if ! command -v ccache >/dev/null 2>&1; then
            echo "FAIL: ccache is not installed"
            exit 1
          fi
          echo "PASS: ccache is installed at $(which ccache)"

      - name: Assert ccache max_size is set to 100MB
        run: |
          echo "Checking ccache max_size is 100MB..."
          CONFIG=$(ccache -p 2>/dev/null || ccache --print-config 2>/dev/null || true)
          echo "Config output: $CONFIG"
          if echo "$CONFIG" | grep -q "100"; then
            echo "PASS: 100MB max_size found in config"
          else
            echo "FAIL: 100MB not found in ccache config"
            exit 1
          fi

      - name: Assert compression is configured
        run: |
          echo "Checking ccache compression is configured..."
          CONFIG=$(ccache -p 2>/dev/null || ccache --print-config 2>/dev/null || true)
          echo "Config output: $CONFIG"
          if echo "$CONFIG" | grep -qi "compression"; then
            echo "PASS: compression is configured"
          else
            echo "FAIL: compression not found in ccache config"
            exit 1
          fi
