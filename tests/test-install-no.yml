name: Test ccache with install=no (pre-installed ccache)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js 24
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x -o /tmp/nodesource_setup.sh
          sudo bash /tmp/nodesource_setup.sh
          sudo apt-get install -y nodejs
          node --version
          sudo ln -sf "$(which node)" /usr/local/bin/node24 || true

      - name: Pre-install ccache via apt
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ccache
          echo "Pre-installed ccache version: $(ccache --version | head -1)"

      - name: Run ccache action with install=no
        id: ccache
        uses: .
        with:
          variant: ccache
          install: no
          append-timestamp: false
          restore: false
          save: false

      - name: Assert ccache is still available (pre-installed)
        run: |
          echo "Checking ccache is available..."
          if ! command -v ccache >/dev/null 2>&1; then
            echo "FAIL: ccache is not available"
            exit 1
          fi
          echo "PASS: ccache is available at $(which ccache)"

      - name: Assert ccache is configured
        run: |
          echo "Checking ccache config..."
          CONFIG=$(ccache -p 2>/dev/null || ccache --print-config 2>/dev/null || true)
          echo "Config output: $CONFIG"
          if echo "$CONFIG" | grep -q "cache_dir"; then
            echo "PASS: ccache is configured"
          else
            echo "FAIL: ccache is not configured"
            exit 1
          fi
