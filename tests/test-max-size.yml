name: Test custom max-size
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: binary
          restore: "false"
          save: "false"
          max-size: 2G
      - name: Assert max_size set
        run: |
          MAX="$(ccache -k max_size)"
          echo "max_size: $MAX"
          if ! echo "$MAX" | grep -q '2'; then
            echo "FAIL: expected max_size of 2G"
            exit 1
          fi
          if echo "$MAX" | grep -q '500'; then
            echo "FAIL: max_size still the default"
            exit 1
          fi
          echo "PASS"
