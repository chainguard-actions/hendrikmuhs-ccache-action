name: Test ccache with restore disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          restore: false
          max-size: 100MB
          append-timestamp: false
          update-package-index: true
      - name: Assert ccache is installed even without restore
        run: |
          echo "Checking ccache is available..."
          if ! command -v ccache >/dev/null 2>&1; then
            echo "FAIL: ccache not found in PATH"
            exit 1
          fi
          echo "ccache version: $(ccache --version | head -1)"
          echo "PASS: ccache is installed with restore=false"
