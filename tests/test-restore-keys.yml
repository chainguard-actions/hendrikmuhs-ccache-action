name: Test restore-keys input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          key: test-restore-keys-scenario
          restore-keys: |
            test-restore-keys-
            test-
          max-size: 100M
          append-timestamp: false
          save: false
      - name: Assert ccache is available
        run: |
          echo "Checking ccache is installed and accessible..."
          if ! command -v ccache >/dev/null 2>&1; then
            echo "FAIL: ccache not found on PATH"
            exit 1
          fi
          echo "PASS: ccache is available at $(command -v ccache)"
      - name: Assert ccache reports a max size
        run: |
          echo "Checking ccache configuration..."
          ccache --show-config 2>&1 || ccache -p 2>&1 || true
          echo "PASS: ccache configuration accessible"
