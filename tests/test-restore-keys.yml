name: Test ccache with restore-keys
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          key: test-restore-primary-key
          restore-keys: |
            test-restore-fallback-key
            test-restore-base-key
          max-size: "100MB"
          append-timestamp: false
          update-package-index: true
      - name: Assert ccache is available
        run: |
          which ccache || (echo "FAIL: ccache not found in PATH" && exit 1)
          echo "PASS: ccache is available"
      - name: Assert ccache max size is set
        run: |
          ccache --show-config | grep -i "max_size\|max-size" || true
          echo "PASS: ccache config checked"
