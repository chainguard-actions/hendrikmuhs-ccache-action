name: Test restore-keys input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          key: test-restore-keys-primary
          restore-keys: |
            test-restore-keys-
            test-
          max-size: 100MB
          append-timestamp: false
      - name: Assert ccache is available
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            echo "FAIL: ccache is not available after action ran"
            exit 1
          fi
          echo "PASS: ccache is available"
      - name: Assert ccache is functional
        run: |
          ccache --version
          echo "PASS: ccache --version succeeded"
