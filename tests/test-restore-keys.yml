name: Test restore-keys input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          key: restore-keys-test
          restore-keys: |
            restore-keys-fallback-
            restore-keys-base-
          max-size: 100MB
          append-timestamp: false
          update-package-index: true
      - name: Assert ccache is available
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            echo "FAIL: ccache not found on PATH"
            exit 1
          fi
          echo "PASS: ccache is available at $(command -v ccache)"
      - name: Assert ccache is functional
        run: |
          VERSION=$(ccache --version | head -1)
          echo "ccache version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: ccache --version returned empty"
            exit 1
          fi
          echo "PASS: ccache is functional"
