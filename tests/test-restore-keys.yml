name: Test ccache with restore-keys
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: ccache
        uses: .
        with:
          key: my-primary-cache-key
          restore-keys: |
            my-fallback-key-
            my-base-key-
          max-size: "100MB"
          append-timestamp: false
          update-package-index: true
      - name: Assert ccache is available
        run: |
          which ccache || (echo "FAIL: ccache not found in PATH" && exit 1)
          echo "PASS: ccache is available with restore-keys"
      - name: Assert ccache version
        run: |
          ccache --version
          echo "PASS: ccache --version succeeded"
