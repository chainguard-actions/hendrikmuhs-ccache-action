name: Test restore with key and restore-keys
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: binary
          key: act-test-${{ github.run_id }}
          restore-keys: |
            act-test-
          append-timestamp: "false"
          save: "false"
          verbose: "1"
      - name: Assert action configured ccache after restore attempt
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          CACHE_DIR="$(ccache -k cache_dir)"
          echo "cache_dir: $CACHE_DIR"
          if [ "$CACHE_DIR" != "$GITHUB_WORKSPACE/.ccache" ]; then
            echo "FAIL: unexpected cache_dir"
            exit 1
          fi
          echo "PASS"
