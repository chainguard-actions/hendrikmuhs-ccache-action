name: Test sccache variant
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          variant: sccache
          install: binary
          restore: "false"
          save: "false"
      - name: Assert sccache installed and server running
        run: |
          echo "sccache path: $(command -v sccache || true)"
          if ! command -v sccache >/dev/null 2>&1; then
            echo "FAIL: sccache not on PATH"
            exit 1
          fi
          sccache --version
          if ! sccache -s; then
            echo "FAIL: sccache stats failed (server not running?)"
            exit 1
          fi
          echo "PASS"
