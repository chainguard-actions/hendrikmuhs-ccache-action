name: Test ccache with update-package-index enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js 24
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x -o /tmp/nodesource_setup.sh
          sudo bash /tmp/nodesource_setup.sh
          sudo apt-get install -y nodejs
          node --version
          sudo ln -sf "$(which node)" /usr/local/bin/node24 || true

      - name: Run ccache action with update-package-index=true
        id: ccache
        uses: .
        with:
          variant: ccache
          update-package-index: true
          append-timestamp: false
          restore: false
          save: false

      - name: Assert ccache is installed
        run: |
          echo "Checking ccache is installed..."
          if ! command -v ccache >/dev/null 2>&1; then
            echo "FAIL: ccache is not installed"
            exit 1
          fi
          echo "PASS: ccache is installed at $(which ccache)"

      - name: Assert ccache is configured
        run: |
          echo "Checking ccache config..."
          CONFIG=$(ccache -p 2>/dev/null || ccache --print-config 2>/dev/null || true)
          echo "Config output: $CONFIG"
          if echo "$CONFIG" | grep -q "cache_dir"; then
            echo "PASS: ccache is configured"
          else
            echo "FAIL: ccache is not configured"
            exit 1
          fi

      - name: Assert ccache version is retrievable
        run: |
          echo "Checking ccache version..."
          VERSION=$(ccache --version 2>/dev/null | head -1 || true)
          echo "Version: $VERSION"
          if [ -n "$VERSION" ]; then
            echo "PASS: ccache version retrieved: $VERSION"
          else
            echo "FAIL: ccache version not retrievable"
            exit 1
          fi
