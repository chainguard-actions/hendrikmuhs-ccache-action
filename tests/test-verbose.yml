name: Test ccache with verbose output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js 24
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x -o /tmp/nodesource_setup.sh
          sudo bash /tmp/nodesource_setup.sh
          sudo apt-get install -y nodejs
          node --version
          sudo ln -sf "$(which node)" /usr/local/bin/node24 || true

      - name: Run ccache action with verbose=1
        id: ccache
        uses: .
        with:
          variant: ccache
          verbose: 1
          append-timestamp: false
          restore: false
          save: false
          update-package-index: true

      - name: Assert ccache is installed
        run: |
          echo "Checking ccache is installed..."
          if ! command -v ccache >/dev/null 2>&1; then
            echo "FAIL: ccache is not installed"
            exit 1
          fi
          echo "PASS: ccache is installed at $(which ccache)"

      - name: Assert ccache is configured
        run: |
          echo "Checking ccache config..."
          CONFIG=$(ccache -p 2>/dev/null || ccache --print-config 2>/dev/null || true)
          echo "Config output: $CONFIG"
          if echo "$CONFIG" | grep -q "cache_dir"; then
            echo "PASS: ccache is configured"
          else
            echo "FAIL: ccache is not configured"
            exit 1
          fi

      - name: Assert ccache stats work with verbose flag
        run: |
          echo "Checking ccache stats with verbose..."
          # Check if ccache supports --verbose flag
          if ccache --help 2>&1 | grep -q "\-\-verbose"; then
            STATS=$(ccache -s -v 2>/dev/null || true)
          else
            STATS=$(ccache -s 2>/dev/null || true)
          fi
          echo "Stats: $STATS"
          echo "PASS: ccache stats ran successfully"
